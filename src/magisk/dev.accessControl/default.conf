# 1: let the Magisk action button reload rules into the live policy.
# 0: only load rules while booting. No background polling is used.
DYNAMIC_LOAD=1

# Maximum size of access-control.log before it is rotated, in KiB.
MAX_LOG_SIZE_KB=256

# Existing app domain whose live allow rules are cloned for each ac_* domain.
# untrusted_app is the conservative default for current third-party apps.
BASE_DOMAIN=untrusted_app
